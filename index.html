 <!DOCTYPE html>
 <html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <div class="home">
                    <h3>HOME</h3>
                    <h2 id="leftScoreBoard">0</h2>
                    <div class="btn_row">
                        <button class="btn" onclick="addScore('leftScoreBoard', 1)">+1</button>
                        <button class="btn" onclick="addScore('leftScoreBoard', 2)">+2</button>
                        <button class="btn" onclick="addScore('leftScoreBoard', 3)">+3</button>
                    </div>
                </div>
            </div>
            <div>
                <div class="guest">
                    <h3>GUEST</h3>
                    <h2 id="rightScoreBoard">0</h2>
                    <div class="btn_row">
                        <button class="btn" onclick="addScore('rightScoreBoard', 1)">+1</button>
                        <button class="btn" onclick="addScore('rightScoreBoard', 2)">+2</button>
                        <button class="btn" onclick="addScore('rightScoreBoard', 3)">+3</button>
                    </div>
                </div>
            </div>
            <div class="reset">
                    <button class="reset_btn" onclick="reset()">Reset</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
